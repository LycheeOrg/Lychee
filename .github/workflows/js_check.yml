name: Check JS

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check_js:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 24
          - 26
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+ with Node.js ${{ matrix.node-version }}
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: ${{ matrix.node-version }}
          cache: true
          run-install: false

      - name: Install
        run: vp install --frozen-lockfile

      - name: Check formatting and lint
        run: vp check

      - name: Check TypeScript
        run: vp run typecheck

      - name: Compile Front-end
        run: vp run build
