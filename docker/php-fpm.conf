; Lychee legacy image: nginx talks to PHP-FPM over a unix socket.
; Overrides the image's default "listen = 9000", which accepts
; connections on every interface of the container.
[www]
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
; nginx already logs every request
access.log = /dev/null
